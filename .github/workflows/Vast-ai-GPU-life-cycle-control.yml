name: LTX2 Video GPU — Lifecycle Control
run-name: "${{ inputs.action }} on #${{ inputs.instance_id || 'auto' }} (${{ inputs.gpu_tier }})"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run in order: 1) create  2) deploy  3) health_check — then stop/start anytime — 4) destroy when fully done"
        required: true
        type: choice
        options: [create, deploy, health_check, stop, start, destroy]
      instance_id:
        description: "Leave blank to auto-use your most recent instance."
        required: false
        type: string
      gpu_tier:
        description: "create only: 'rtx3090' = real target, 'cheapest' = lifecycle testing"
        required: false
        type: choice
        options: [rtx3090, cheapest]
        default: rtx3090

permissions:
  contents: write

env:
  PROJECT_DIR: social-media-automatio/ltx2-video-gpu
  LOG_FILE: social-media-automatio/ltx2-video-gpu/price-log.csv

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # raised: deploy now polls instead of blocking, but still needs real room for a 45-70GB download on a mediocre host

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install vast CLI
        run: pip install vastai

      - name: Resolve instance ID
        if: ${{ github.event.inputs.action != 'create' }}
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.instance_id }}" ]; then
            IID="${{ github.event.inputs.instance_id }}"
          else
            IID=$(vastai show instances --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[-1]['id'] if d else '')")
            [ -z "$IID" ] && { echo "No active instance found."; exit 1; }
            echo "Auto-detected instance: $IID"
          fi
          echo "iid=$IID" >> "$GITHUB_OUTPUT"

      - name: Create instance
        if: ${{ github.event.inputs.action == 'create' }}
        id: create
        run: |
          set -e
          # inet_down>200 (Mbps): rules out the class of host that caused
          # the last two deploy failures BEFORE we ever rent it — this is
          # the permanent fix, not a bigger timeout number.
          if [ "${{ github.event.inputs.gpu_tier }}" == "rtx3090" ]; then
            QUERY='reliability>0.95 num_gpus=1 gpu_name=RTX_3090 disk_space>80 direct_port_count>=1 inet_down>200 verified=true geolocation notin [CN]'
            DISK=80
          else
            QUERY='reliability>0.95 num_gpus=1 disk_space>20 direct_port_count>=1 inet_down>200 verified=true geolocation notin [CN]'
            DISK=20
          fi

          OFFER_JSON=$(vastai search offers "$QUERY" -o 'dph_total' --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}")
          OFFER_ID=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          PRICE=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['dph_total'])")
          GPU=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['gpu_name'])")
          echo "Selected offer $OFFER_ID: $GPU at \$${PRICE}/hr"

          vastai create instance "$OFFER_ID" \
            --image vastai/base-image:cuda-12.8.1-auto \
            --disk $DISK --env '-p 7860:7860' --ssh --direct \
            --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"

          echo "---- raw 'show user' output, for credit field confirmation ----"
          vastai show user --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"

          mkdir -p "$PROJECT_DIR"
          echo "timestamp,action,offer_id,gpu,price_per_hr" >> "$LOG_FILE" 2>/dev/null || true
          echo "$(date -u +%FT%TZ),create,$OFFER_ID,$GPU,\$${PRICE}/hr" >> "$LOG_FILE"
          echo "### Created: $GPU at \$${PRICE}/hr (offer $OFFER_ID)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit log
        if: ${{ github.event.inputs.action == 'create' }}
        run: |
          git config user.name "ltx2-gpu-bot"
          git config user.email "actions@github.com"
          git add "$LOG_FILE"
          git commit -m "Log: $(tail -1 $LOG_FILE)" || echo "Nothing to commit"
          git push

      - name: Poll until running
        if: ${{ github.event.inputs.action == 'create' }}
        run: |
          STATUS="none"
          for i in $(seq 1 20); do
            STATUS=$(vastai show instances --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[-1]['actual_status'] if d else 'none')")
            echo "Attempt $i: status = $STATUS"
            [ "$STATUS" == "running" ] && { vastai show instances --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"; break; }
            sleep 15
          done

          if [ "$STATUS" != "running" ]; then
            echo "FAIL: instance never reached 'running' after 20 attempts (last status: $STATUS)."
            echo "This is usually a HOST-SIDE failure (e.g. 'docker_build() error writing dockerfile')"
            echo "that never shows up here — check the instance card on cloud.vast.ai/instances"
            echo "for the real reason, then destroy and re-run create to try a different host."
            IID=$(vastai show instances --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[-1]['id'] if d else '')")
            if [ -n "$IID" ]; then
              echo "Destroying broken instance $IID so it stops billing..."
              yes | vastai destroy instance "$IID" --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}" || true
            fi
            echo "### Create FAILED — instance never started (last status: $STATUS). Broken instance auto-destroyed. See vast.ai instance card for the host-side reason." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### Instance running — ready for deploy" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop instance
        if: ${{ github.event.inputs.action == 'stop' }}
        run: yes | vastai stop instance ${{ steps.resolve.outputs.iid }} --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"

      - name: Start instance
        if: ${{ github.event.inputs.action == 'start' }}
        run: yes | vastai start instance ${{ steps.resolve.outputs.iid }} --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"

      - name: Destroy instance
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: yes | vastai destroy instance ${{ steps.resolve.outputs.iid }} --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}"

      - name: Deploy
        if: ${{ github.event.inputs.action == 'deploy' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.LTX2_GPU_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          INFO=$(vastai show instance ${{ steps.resolve.outputs.iid }} --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}")

          HOST=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['public_ipaddr'])")
          PORT=$(echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); p=d.get('ports',{}).get('22/tcp'); print(p[0]['HostPort'] if p else d['ssh_port'])")
          echo "SSH target: $HOST:$PORT"

          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p $PORT root@$HOST"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -P "$PORT" \
            "$PROJECT_DIR"/scripts/preflight.sh "$PROJECT_DIR"/scripts/bootstrap.sh "$PROJECT_DIR"/scripts/start.sh \
            root@"$HOST":~/

          printf '%s' "${{ secrets.LTX2_GPU_HF_TOKEN }}" | $SSH 'cat > ~/.hf_token && chmod 600 ~/.hf_token'

          # --- Fire-and-forget launch ---
          # Runs on the box, detached from this SSH session entirely.
          # A network blip, a slow host, or GitHub Actions itself
          # restarting no longer kills the install — it just keeps
          # running on the GPU box regardless. We poll separately below.
          $SSH "export HF_TOKEN=\$(cat ~/.hf_token) && \
            nohup bash -c 'bash preflight.sh && bash bootstrap.sh && bash start.sh' \
            > ~/deploy.log 2>&1 < /dev/null & disown; echo LAUNCHED" < /dev/null

          echo "Install launched in background. Polling ~/deploy.log for progress..."

          # --- Idle-based polling, not a total-duration guess ---
          # Fails only if deploy.log stops GROWING for ~5 min straight —
          # a true hang — never just because the whole thing is slow.
          # 160 attempts x 15s = up to 40 min of real polling time.
          PREV_SIZE=-1
          STALL_COUNT=0
          for i in $(seq 1 160); do
            REMOTE_LOG=$($SSH 'wc -c < ~/deploy.log 2>/dev/null || echo 0' < /dev/null)
            CUR_SIZE=$(echo "$REMOTE_LOG" | tr -dc '0-9')
            [ -z "$CUR_SIZE" ] && CUR_SIZE=0

            if [ "$CUR_SIZE" -gt "$PREV_SIZE" ]; then
              STALL_COUNT=0
            else
              STALL_COUNT=$((STALL_COUNT + 1))
            fi
            PREV_SIZE=$CUR_SIZE
            echo "Attempt $i: deploy.log = ${CUR_SIZE} bytes (stall count: $STALL_COUNT)"

            TAIL=$($SSH 'tail -n 5 ~/deploy.log 2>/dev/null' < /dev/null || true)

            if echo "$TAIL" | grep -q "Starting Wan2GP"; then
              echo "SUCCESS: start.sh reached, Wan2GP launching."
              echo "### Deployed to $HOST:$PORT — run health_check next" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if echo "$TAIL" | grep -q "^FAIL:"; then
              echo "FAILED: preflight.sh or bootstrap.sh reported a FAIL line:"
              echo "$TAIL"
              echo "### Deploy FAILED — see deploy.log on the instance for details" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$STALL_COUNT" -ge 20 ]; then
              echo "FAILED: deploy.log has not grown in ~5 minutes — real hang, not just slow."
              echo "Last lines:"
              echo "$TAIL"
              echo "### Deploy FAILED — stalled with no progress for 5 min. Check ~/deploy.log on the instance." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 15
          done

          echo "FAILED: still running after 40 minutes of polling, no success/fail marker seen yet."
          echo "Not necessarily broken — may just be a very large download still in progress."
          echo "Re-run action: deploy with the same instance_id to resume polling (install keeps running regardless)."
          exit 1

      - name: Health check
        if: ${{ github.event.inputs.action == 'health_check' }}
        run: |
          set -e
          INFO=$(vastai show instance ${{ steps.resolve.outputs.iid }} --raw --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}")
          echo "---- raw instance info, for port-field confirmation ----"
          echo "$INFO" | python3 -m json.tool
          HOST=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['public_ipaddr'])")
          PORT=$(echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('ports',{}).get('7860/tcp',[{}])[0].get('HostPort','7860'))")
          URL="http://$HOST:$PORT/"
          curl -sSf -m 15 "$URL" && echo "Health check PASSED: $URL" || echo "Health check FAILED: $URL"
          echo "### Callable URL: $URL" >> "$GITHUB_STEP_SUMMARY"
