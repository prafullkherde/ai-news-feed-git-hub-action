name: LTX2 Setup Volume (run once)
run-name: "setup-volume — one-time weights download"

on:
  workflow_dispatch:
    inputs:
      volume_size_gb:
        description: "Volume size in GB (weights are ~45-70GB; leave room). Only used if no ltx2_weights volume exists yet."
        required: false
        type: string
        default: "80"
      min_days_remaining:
        description: "Reject volume offers whose host listing ends sooner than this. Vast deletes the volume when the listing ends."
        required: false
        type: string
        default: "30"
      gpu_min_ram_gb:
        description: "Minimum GPU VRAM (GB) on the host machine"
        required: false
        type: string
        default: "24"
      wan2gp_image:
        description: "Locked default — only change after checking hub.docker.com/r/robatvastai/wan2gp/tags and deliberately deciding to move"
        required: true
        type: string
        default: "robatvastai/wan2gp:b8b18f8-2026-10-01-cuda-12.9-amd64"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install vast CLI
        run: pip install vastai

      - name: Find existing volume, or create one on a GPU-available, long-lived host
        id: volume
        run: |
          set -e
          KEY="${{ secrets.LTX2_GPU_VAST_API_KEY }}"
          echo "Checking for an existing ltx2_weights volume — if found, reuse it, don't touch it."
          EXISTING=$(vastai show volumes --raw --api-key "$KEY")
          VOL_MATCH=$(echo "$EXISTING" | python3 -c "import json,sys; d=json.load(sys.stdin); m=[v for v in d if v.get('label')=='ltx2_weights' or v.get('name')=='ltx2_weights']; print(json.dumps(m[0]) if m else '')")

          if [ -n "$VOL_MATCH" ]; then
            VOL_ID=$(echo "$VOL_MATCH" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            MACHINE_ID=$(echo "$VOL_MATCH" | python3 -c "import json,sys; print(json.load(sys.stdin)['machine_id'])")
            echo "Found existing volume ltx2_weights (id=$VOL_ID) on machine $MACHINE_ID — reusing as-is."
            echo "---- existing volume record (check expiry fields) ----"
            echo "$VOL_MATCH" | python3 -m json.tool
            echo "vol_id=$VOL_ID" >> "$GITHUB_OUTPUT"
            echo "machine_id=$MACHINE_ID" >> "$GITHUB_OUTPUT"
            echo "### Reusing existing volume ltx2_weights, id=$VOL_ID — no new volume created" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "No existing ltx2_weights volume — finding machines with a free GPU first."
          # A volume is pinned to one machine; the setup instance must run on that same machine.
          GPU_MACHINES=$(vastai search offers "num_gpus=1 direct_port_count>=1 gpu_ram>=${{ github.event.inputs.gpu_min_ram_gb }} disk_space>=20" --raw --api-key "$KEY" | python3 -c "import json,sys; print(json.dumps(sorted({o['machine_id'] for o in json.load(sys.stdin)})))")
          echo "Machines with a free GPU right now: $GPU_MACHINES"

          OFFERS=$(vastai search volumes -o 'storage_total_cost' --raw --api-key "$KEY")
          PICK=$(echo "$OFFERS" | GPU_MACHINES="$GPU_MACHINES" MIN_DAYS="${{ github.event.inputs.min_days_remaining }}" python3 -c "import json,sys,os,time; ok=set(json.loads(os.environ['GPU_MACHINES'])); need=time.time()+int(os.environ['MIN_DAYS'])*86400; m=[o for o in json.load(sys.stdin) if o['machine_id'] in ok and (o.get('end_date') is None or o['end_date']>=need)]; print(json.dumps(m[0]) if m else '')")
          [ -z "$PICK" ] && { echo "FAIL: no volume offer on a GPU-available machine with >= ${{ github.event.inputs.min_days_remaining }} days remaining. Retry later or lower min_days_remaining."; exit 1; }

          echo "---- selected volume offer (verify end_date / expiry field name) ----"
          echo "$PICK" | python3 -m json.tool
          OFFER_ID=$(echo "$PICK" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          MACHINE_ID=$(echo "$PICK" | python3 -c "import json,sys; print(json.load(sys.stdin)['machine_id'])")
          echo "Selected offer: $OFFER_ID on machine $MACHINE_ID"

          vastai create volume "$OFFER_ID" \
            --size "${{ github.event.inputs.volume_size_gb }}" \
            --name ltx2_weights --api-key "$KEY"

          VOL_JSON=$(vastai show volumes --raw --api-key "$KEY")
          VOL_ID=$(echo "$VOL_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); match=[v for v in d if v.get('label')=='ltx2_weights' or v.get('name')=='ltx2_weights']; print((match[0] if match else d[-1])['id'])")
          echo "Volume ID: $VOL_ID"
          echo "vol_id=$VOL_ID" >> "$GITHUB_OUTPUT"
          echo "machine_id=$MACHINE_ID" >> "$GITHUB_OUTPUT"
          echo "### Volume created: ltx2_weights, id=$VOL_ID (${{ github.event.inputs.volume_size_gb }}GB), from offer $OFFER_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Rent a temporary instance with the volume attached
        id: rent
        run: |
          set -e
          KEY="${{ secrets.LTX2_GPU_VAST_API_KEY }}"
          MACHINE_ID="${{ steps.volume.outputs.machine_id }}"

          echo "Trying direct SSH offers on machine $MACHINE_ID..."
          OFFER_JSON=$(vastai search offers "machine_id=$MACHINE_ID num_gpus=1 direct_port_count>=1" -o 'dph_total' --raw --api-key "$KEY")
          COUNT=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")

          if [ "$COUNT" -eq 0 ]; then
            echo "No direct-port offer on this machine right now — falling back to any offer (proxy SSH)."
            echo "This is a ONE-TIME setup instance, not the daily pattern — proxy SSH here is an acceptable trade-off."
            OFFER_JSON=$(vastai search offers "machine_id=$MACHINE_ID num_gpus=1" -o 'dph_total' --raw --api-key "$KEY")
            COUNT=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "FAIL: machine $MACHINE_ID has NO free GPU offers at all right now."
            echo "The volume (id ${{ steps.volume.outputs.vol_id }}) still exists and is NOT lost — just retry this workflow later."
            exit 1
          fi

          echo "---- raw offers on this machine, for field confirmation ----"
          echo "$OFFER_JSON" | python3 -m json.tool
          OFFER_ID=$(echo "$OFFER_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "Renting offer $OFFER_ID with image ${{ github.event.inputs.wan2gp_image }}, linking volume ${{ steps.volume.outputs.vol_id }}..."

          CREATE_OUT=$(vastai create instance "$OFFER_ID" \
            --image "${{ github.event.inputs.wan2gp_image }}" \
            --disk 20 --env '-p 7860:7860' --ssh --direct \
            --link-volume ${{ steps.volume.outputs.vol_id }} --mount-path /data \
            --raw --api-key "$KEY")
          echo "$CREATE_OUT"

          # Exact contract ID of the instance we just created — never index into the account-wide list.
          IID=$(echo "$CREATE_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['new_contract'])")
          echo "iid=$IID" >> "$GITHUB_OUTPUT"

          STATUS=none
          for i in $(seq 1 20); do
            STATUS=$(vastai show instance "$IID" --raw --api-key "$KEY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('actual_status') or 'none')")
            echo "Attempt $i: status = $STATUS"
            [ "$STATUS" == "running" ] && break
            sleep 15
          done
          [ "$STATUS" != "running" ] && { echo "FAIL: temp instance never started"; exit 1; }

          INFO=$(vastai show instance "$IID" --raw --api-key "$KEY")
          HOST=$(echo "$INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['public_ipaddr'])")
          PORT=$(echo "$INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); p=(d.get('ports') or {}).get('22/tcp'); print(p[0]['HostPort'] if p else d['ssh_port'])")
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Discover the image's real layout (don't trust assumptions)
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.LTX2_GPU_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p ${{ steps.rent.outputs.port }} root@${{ steps.rent.outputs.host }}"

          echo "## Discovery results" >> "$GITHUB_STEP_SUMMARY"
          WGP_PATH=$($SSH "find / -maxdepth 4 -name wgp.py 2>/dev/null | head -1" < /dev/null)
          echo "wgp.py found at: ${WGP_PATH:-NOT FOUND}" | tee -a "$GITHUB_STEP_SUMMARY"

          FFMPEG=$($SSH "command -v ffmpeg || echo MISSING" < /dev/null)
          echo "ffmpeg: $FFMPEG" | tee -a "$GITHUB_STEP_SUMMARY"

          $SSH "python3 -c 'import torch; print(torch.__version__, torch.cuda.is_available())' || echo 'torch check failed'" < /dev/null | tee -a "$GITHUB_STEP_SUMMARY"

          echo "### ACTION NEEDED: copy the wgp.py path above into bootstrap-v2.sh / start-v2.sh's WAN2GP_DIR if it differs from /root/Wan2GP" >> "$GITHUB_STEP_SUMMARY"

      - name: Download weights onto the volume
        run: |
          set -e
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p ${{ steps.rent.outputs.port }} root@${{ steps.rent.outputs.host }}"
          printf '%s' "${{ secrets.LTX2_GPU_HF_TOKEN }}" | $SSH 'cat > ~/.hf_token && chmod 600 ~/.hf_token'
          $SSH "export HF_TOKEN=\$(cat ~/.hf_token) && \
            pip install -U 'huggingface_hub[cli]' -q && \
            huggingface-cli download Lightricks/LTX-2 --include 'ltx-2-19b-distilled.safetensors' --local-dir /data --token \$HF_TOKEN && \
            huggingface-cli download google/gemma-3-12b-it --local-dir /data/gemma3 --token \$HF_TOKEN && \
            echo WEIGHTS_DOWNLOADED" < /dev/null
          echo "### Weights downloaded to volume ltx2_weights:/data — lives until the host's listing ends (see end_date in the volume offer log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy the temporary instance (volume survives)
        if: always()
        run: |
          IID="${{ steps.rent.outputs.iid }}"
          if [ -z "$IID" ]; then
            echo "No instance ID captured (an earlier step likely failed first) — nothing to destroy."
          else
            yes | vastai destroy instance "$IID" --api-key "${{ secrets.LTX2_GPU_VAST_API_KEY }}" || true
          fi
          echo "### Temp instance destroyed (if one was created). Volume ltx2_weights persists until its host listing expires." >> "$GITHUB_STEP_SUMMARY"
