# Save as .github/workflows/carousel-pipeline.yml in your repo
name: Daily Carousel Pipeline

on:
  schedule:
    # 4 triggers/day, ~4hr apart, IST-adjusted (UTC times below)
    - cron: "30 3 * * *"   # 09:00 IST
    - cron: "30 7 * * *"   # 13:00 IST
    - cron: "30 11 * * *"  # 17:00 IST
    - cron: "30 14 * * *"  # 20:00 IST
  workflow_dispatch: {}     # manual trigger for testing

jobs:
  post-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install groq requests Pillow
      - name: Run pipeline
        working-directory: social-media-automatio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          IMAGE_HOST_BASE: ${{ secrets.IMAGE_HOST_BASE }}
        run: python run_pipeline.py
      - name: Commit updated queue state
        run: |
          git config user.name "carousel-bot"
          git config user.email "bot@noreply.local"
          git add social-media-automatio/state/queue.json
          git diff --cached --quiet || git commit -m "chore: update queue state"
          git push
