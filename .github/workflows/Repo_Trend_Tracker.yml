name: Repo Trend Tracker

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-trend-tracker   # <-- everything below runs from here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          GROQ_API_KEY_FOR_AUTO_EMAIL: ${{ secrets.GROQ_API_KEY_FOR_AUTO_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python track_and_notify.py

      - name: Commit updated data
        if: always()
        working-directory: .                    # <-- git commands need the repo root, not the subfolder
        run: |
          git config user.name "repo-trend-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add repo-trend-tracker/data/snapshots.csv repo-trend-tracker/data/notified.json repo-trend-tracker/data/health.json repo-trend-tracker/dashboard/data.json
          git diff --cached --quiet || git commit -m "chore: update trend snapshot [skip ci]"
          git push

      - name: Notify on hard failure
        if: failure()
        working-directory: .
        run: |
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"onboarding@resend.dev\",\"to\":[\"${{ secrets.MY_EMAIL }}\"],\"subject\":\"Repo Trend Tracker FAILED\",\"html\":\"<p>The workflow run failed. Check the Actions log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>\"}" \
            || true
