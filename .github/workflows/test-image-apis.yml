# Save as .github/workflows/test-image-apis.yml
# Separate, one-off workflow -- does NOT touch your working carousel pipeline.
name: Test Image Generation APIs

on:
  workflow_dispatch: {}   # manual trigger only, this is a one-time comparison test

jobs:
  test-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Run API tests
        working-directory: social-media-automatio  # adjust path if you place the script elsewhere
        env:
          # Optional -- add these as repo secrets to test candidates 3/5-11.
          # All prefixed IMGAPI_ so you can find and delete them as a group
          # once you've picked a winner and don't need the rest anymore.
          IMGAPI_HF_TOKEN: ${{ secrets.IMGAPI_HF_TOKEN }}
          IMGAPI_DEEPAI_KEY: ${{ secrets.IMGAPI_DEEPAI_KEY }}
          IMGAPI_STABILITY_KEY: ${{ secrets.IMGAPI_STABILITY_KEY }}
          IMGAPI_FAL_KEY: ${{ secrets.IMGAPI_FAL_KEY }}
          IMGAPI_REPLICATE_KEY: ${{ secrets.IMGAPI_REPLICATE_KEY }}
          IMGAPI_SEGMIND_KEY: ${{ secrets.IMGAPI_SEGMIND_KEY }}
          IMGAPI_OPENAI_KEY: ${{ secrets.IMGAPI_OPENAI_KEY }}
          IMGAPI_LEONARDO_KEY: ${{ secrets.IMGAPI_LEONARDO_KEY }}
        run: python test_image_apis.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: image-api-test-results
          path: social-media-automatio/results/
          retention-days: 7
