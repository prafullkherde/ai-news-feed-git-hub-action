name: Stock Debate

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 3:30 UTC = 9:00 AM IST, weekdays
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the updated logs/ back to the repo

jobs:
  run-debate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pandas
      - run: python Multi-Agent-Stock-Debate/Main.py
        env:
          # reused from your existing ai-news-feed-git-hub-action secrets:
          GROQ_API_KEY_FOR_AUTO_EMAIL: ${{ secrets.GROQ_API_KEY_FOR_AUTO_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          # new secret — free key from https://aistudio.google.com/apikey
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # new, all prefixed STOCK_P_ so they're identifiable in the secrets list:
          STOCK_P_TICKERS: ${{ secrets.STOCK_P_TICKERS }}                       # default in code: CDSL.NS,TRENT.NS,SUZLON.NS,MON100.NS
          STOCK_P_PORTFOLIO_VALUE: ${{ secrets.STOCK_P_PORTFOLIO_VALUE }}       # default in code: 100000
          STOCK_P_MAX_POSITION_PCT: ${{ secrets.STOCK_P_MAX_POSITION_PCT }}     # default in code: 5
          STOCK_P_CURRENT_EXPOSURE_JSON: ${{ secrets.STOCK_P_CURRENT_EXPOSURE_JSON }}  # default in code: {}
      - name: Commit updated logs
        run: |
          git config user.name "stock-debate-bot"
          git config user.email "actions@github.com"
          git add Multi-Agent-Stock-Debate/logs/
          git diff --cached --quiet || git commit -m "Log: $(date -u +%Y-%m-%d) debate run"
          git push
