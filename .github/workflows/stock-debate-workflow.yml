name: Stock Debate

on:
  schedule:
    # Real daily run: NSE closes 15:30 IST (10:00 UTC). 13:00 UTC = 18:30
    # IST gives ~3hrs buffer for Yahoo Finance's data to settle after close
    # — running right at/before close risks fetching incomplete same-day data.
    - cron: '0 13 * * 1-5'
    # TEMPORARY — 7am IST test trigger. Remove this line once you've
    # confirmed a run works; it has no purpose after that, and every extra
    # run burns real quota for no benefit (see README's quota-math note).
    # - cron: '30 1 * * 1-5' -- this is causing Both smoking guns line up: the leftover "TEMPORARY" cron and the exact same-minute collision, three days running.
  workflow_dispatch: {}
  # ^ Prefer this over waiting for a scheduled time when you want to test
  # right now — go to Actions tab -> Stock Debate -> Run workflow. Instant,
  # no cron wait, and doesn't require remembering to delete a test trigger.

permissions:
  contents: write   # needed to commit the updated logs/ back to the repo

jobs:
  run-debate:
    runs-on: ubuntu-latest
    concurrency:
      group: repo-git-push-lock
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pandas
      - run: python Multi-Agent-Stock-Debate/Main.py
        env:
          # These 4 are the ONLY secrets this project needs. Every other
          # value (tickers, portfolio size, model choice, retry/delay
          # tuning) lives in Multi-Agent-Stock-Debate/config/settings.py —
          # edit that file directly instead of adding more secrets here.
          GROQ_API_KEY_FOR_AUTO_EMAIL: ${{ secrets.GROQ_API_KEY_FOR_AUTO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
      - name: Commit updated logs
        run: |
          git config user.name "stock-debate-bot"
          git config user.email "actions@github.com"
          git add Multi-Agent-Stock-Debate/logs/
          git diff --cached --quiet || git commit -m "Log: $(date -u +%Y-%m-%d) debate run"
          git push
