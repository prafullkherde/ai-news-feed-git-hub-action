# .github/workflows/job-radar.yml
# Separate from your existing news-feed workflow — same secrets, different cron.
# Fires 7:00 AM IST (1:30 AM UTC) so digest is in inbox before you start day.

name: Job Radar

on:
  schedule:
    - cron: '30 1 * * *'   # 1:30 UTC = 7:00 AM IST daily
  workflow_dispatch:         # manual run for testing — use this first

jobs:
  job-radar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4

      - name: Run job radar
        run: python job_radar.py
        env:
          GROQ_API_KEY_FOR_AUTO_EMAIL: ${{ secrets.GROQ_API_KEY_FOR_AUTO_EMAIL }}
          RESEND_API_KEY:              ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL:                    ${{ secrets.MY_EMAIL }}
